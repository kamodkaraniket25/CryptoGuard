[project]
name = "cryptoguard"
version = "1.0.0"
requires-python = ">=3.12"
description = "CryptoGuard cryptographic verification platform"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<3",
  "python-multipart>=0.0.12",
  "cryptography>=43,<50",
  "httpx>=0.27,<1",
  "jsonschema>=4.22,<5",
]

[tool.vercel]
entrypoint = "api.index:app"
